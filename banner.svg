<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Andrey, Full-Stack Developer, Costa Rica" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D0D12"/>
      <stop offset="1" stop-color="#1b1b20"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C1121F" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#C1121F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="underline" x1="0" x2="1">
      <stop offset="0" stop-color="#C1121F"/>
      <stop offset="0.6" stop-color="#F4A7B9"/>
      <stop offset="1" stop-color="#F4A7B9" stop-opacity="0"/>
    </linearGradient>
    <g id="petal">
      <path d="M0 -9 C7 -9 10 0 0 10 C-10 0 -7 -9 0 -9Z" fill="#F4A7B9"/>
    </g>
    <g id="blossom">
      <use href="#petal" transform="rotate(0) translate(0,-8)"/>
      <use href="#petal" transform="rotate(72) translate(0,-8)"/>
      <use href="#petal" transform="rotate(144) translate(0,-8)"/>
      <use href="#petal" transform="rotate(216) translate(0,-8)"/>
      <use href="#petal" transform="rotate(288) translate(0,-8)"/>
      <circle r="3.2" fill="#C9A227"/>
    </g>
  </defs>

  <rect width="1000" height="320" fill="url(#bg)"/>

  <!-- Red sun -->
  <circle cx="790" cy="160" r="190" fill="url(#glow)"/>
  <circle cx="790" cy="160" r="88" fill="#C1121F" opacity="0.32"/>

  <!-- Sakura branch -->
  <g fill="none" stroke="#3a2a2e" stroke-linecap="round">
    <path d="M1010 36 C920 58 860 112 770 104 C700 98 650 134 585 156" stroke-width="7"/>
    <path d="M860 100 C840 140 800 170 750 182" stroke-width="3.5"/>
    <path d="M770 104 C760 70 730 50 690 44" stroke-width="3"/>
    <path d="M940 66 C960 100 950 140 920 168" stroke-width="3"/>
  </g>
  <use href="#blossom" transform="translate(690,44) scale(1.5)"/>
  <use href="#blossom" transform="translate(750,182) scale(1.3)"/>
  <use href="#blossom" transform="translate(920,168) scale(1.4)"/>
  <use href="#blossom" transform="translate(860,100) scale(1.7)"/>
  <use href="#blossom" transform="translate(640,138) scale(1.2)"/>
  <use href="#blossom" transform="translate(965,52) scale(1.1)"/>

  <!-- Falling petals -->
  <g opacity="0.85">
    <g transform="translate(560,-20) scale(0.9)"><use href="#petal"><animateMotion dur="9s" begin="0s" repeatCount="indefinite" rotate="auto" path="M0 0 C60 90 -40 190 40 360"/></use></g>
    <g transform="translate(640,-20) scale(0.7)"><use href="#petal"><animateMotion dur="11s" begin="-3s" repeatCount="indefinite" rotate="auto" path="M0 0 C-50 100 60 200 -30 360"/></use></g>
    <g transform="translate(720,-20) scale(1)"><use href="#petal"><animateMotion dur="10s" begin="-6s" repeatCount="indefinite" rotate="auto" path="M0 0 C70 80 -20 210 50 360"/></use></g>
    <g transform="translate(800,-20) scale(0.8)"><use href="#petal"><animateMotion dur="12s" begin="-2s" repeatCount="indefinite" rotate="auto" path="M0 0 C-60 110 40 190 -40 360"/></use></g>
    <g transform="translate(880,-20) scale(0.9)"><use href="#petal"><animateMotion dur="9.5s" begin="-7s" repeatCount="indefinite" rotate="auto" path="M0 0 C50 90 -50 200 30 360"/></use></g>
    <g transform="translate(940,-20) scale(0.7)"><use href="#petal"><animateMotion dur="13s" begin="-4s" repeatCount="indefinite" rotate="auto" path="M0 0 C-40 120 50 210 -20 360"/></use></g>
    <g transform="translate(500,-20) scale(0.6)"><use href="#petal"><animateMotion dur="14s" begin="-9s" repeatCount="indefinite" rotate="auto" path="M0 0 C40 100 -30 220 60 360"/></use></g>
  </g>

  <!-- Text -->
  <text x="60" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="14" letter-spacing="5" fill="#E63946">武士道 · BUSHIDŌ</text>
  <text x="58" y="172" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="#F5F0E8" letter-spacing="-1">ANDREY</text>
  <rect x="60" y="188" width="260" height="3" fill="url(#underline)"/>
  <text x="60" y="228" font-family="'Courier New', monospace" font-size="18" fill="#9CA3AF">Full-Stack Developer · Costa Rica</text>
  <text x="60" y="268" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-style="italic" fill="#F4A7B9">«El código limpio es el camino del guerrero»</text>

  <!-- Hanko seal -->
  <g transform="translate(402,118) rotate(-6)">
    <rect width="50" height="62" rx="3" fill="#C1121F" fill-opacity="0.22" stroke="#C1121F" stroke-width="3"/>
    <text x="25" y="27" text-anchor="middle" font-size="22" font-weight="700" fill="#E63946" font-family="serif">安</text>
    <text x="25" y="53" text-anchor="middle" font-size="22" font-weight="700" fill="#E63946" font-family="serif">礼</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
